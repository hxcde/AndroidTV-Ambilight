name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag für den Release, z. B. v0.1.0"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
      HAS_RELEASE_KEY: ${{ secrets.RELEASE_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Tag prüfen
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.]+)?$ ]] || { echo "Ungültiger Tag: $TAG"; exit 1; }
          version=$(sed -nE 's/.*versionName = "([^"]+)".*/\1/p' app/build.gradle.kts)
          [ "v$version" = "$TAG" ] || echo "::warning::versionName ($version) passt nicht zum Tag ($TAG)"

      - name: Unit-Tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: APK bauen (Release-Signatur)
        if: env.HAS_RELEASE_KEY == 'true'
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          export RELEASE_KEYSTORE_FILE="$RUNNER_TEMP/release.jks"
          echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > "$RELEASE_KEYSTORE_FILE"
          ./gradlew --no-daemon assembleRelease
          rm -f "$RELEASE_KEYSTORE_FILE"
          cp app/build/outputs/apk/release/app-release.apk TV-Ambilight.apk
          echo "SIGNATURE=Release-Schlüssel" >> "$GITHUB_ENV"

      - name: APK bauen (Debug-Signatur, kein Release-Schlüssel hinterlegt)
        if: env.HAS_RELEASE_KEY != 'true'
        run: |
          ./gradlew --no-daemon assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk TV-Ambilight.apk
          echo "SIGNATURE=Debug-Schlüssel (Updates erfordern ggf. Deinstallation)" >> "$GITHUB_ENV"

      - name: Release anlegen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha=$(sha256sum TV-Ambilight.apk | cut -d' ' -f1)
          cat > notes.md <<NOTES
          ## Installation am TV

          **Downloader-App** (oder Browser am TV), immer die neueste Version:
          \`https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/TV-Ambilight.apk\`

          **USB-Stick / Dateimanager:** \`TV-Ambilight.apk\` unten herunterladen und am TV öffnen.

          **ADB:** \`adb install -r TV-Ambilight.apk\`

          Optionale Freigaben (ohne Dialog starten, Autostart): siehe [DOKU.md](https://github.com/${GITHUB_REPOSITORY}/blob/${GITHUB_SHA}/DOKU.md#installation-auf-dem-tv).

          ## Details
          - Signatur: ${SIGNATURE}
          - SHA-256: \`${sha}\`
          - Commit: ${GITHUB_SHA}
          NOTES
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" TV-Ambilight.apk --clobber
          else
            gh release create "$TAG" TV-Ambilight.apk --target "$GITHUB_SHA" --title "TV Ambilight $TAG" --notes-file notes.md
          fi
